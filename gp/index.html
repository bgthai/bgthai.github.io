<html>
<head>
    <title>Scary Hands</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
        }
        .content-wrapper {
            width: 800px;
            height: 600px;
            position: relative;
        }
        .content {
            position: relative;
            width: 800px;
            height: 600px;
        }
        .Nimai {
            position: relative;
            width: 800px;
            height: 600px;
        }
        .hands {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 800px;
            height: 600px;
            opacity: 0;
        }
        .slider-container {
            position: absolute;
            bottom: 5px;
            left: 0;
            width: 800px;
            text-align: center;
            z-index: 10;
        }
        .slider-container input {
            width: 50%;
            -webkit-appearance: none; /* Remove default styling for Chrome/Safari */
            appearance: none; /* Standard property */
            height: 5px;
            background: rgba(240, 222, 173, 0.4); /* Track: #f0dead with 40% opacity */
            outline: none;
        }
        /* Slider thumb for Chrome and Safari */
        .slider-container input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            background: rgba(220, 202, 153, 0.9); /* Thumb: Slightly darker, 90% opacity */
            cursor: pointer;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="content">
            <img src="Nimai.jpg" class="Nimai" />
            <img src="Hands.gif" class="hands" id="handsGif" />
            <div class="slider-container">
                <input type="range" id="opacitySlider" min="0" max="1" step="0.01" value="0" />
            </div>
        </div>
    </div>

    <script>
        const slider = document.getElementById('opacitySlider');
        const handsGif = document.getElementById('handsGif');

        slider.addEventListener('input', function() {
            handsGif.style.opacity = this.value;
        });
    </script>
</body>
</html>
