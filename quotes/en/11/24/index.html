    <h2 style="text-align: center;">Bhagavad-gītā As It Is - 11.24</h2>
    <div class="verse-container">
        <p class="trans">O all-pervading Viṣṇu, seeing You with Your many radiant colors touching the sky, Your gaping mouths, and Your great glowing eyes, my mind is perturbed by fear. I can no longer maintain my steadiness or equilibrium of mind.</p>
