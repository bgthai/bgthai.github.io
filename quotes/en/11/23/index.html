    <h2 style="text-align: center;">Bhagavad-gītā As It Is - 11.23</h2>
    <div class="verse-container">
        <p class="trans">O mighty-armed one, all the planets with their demigods are disturbed at seeing Your great form, with its many faces, eyes, arms, thighs, legs and bellies and Your many terrible teeth; and as they are disturbed, so am I.</p>
