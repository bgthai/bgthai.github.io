    <h2 style="text-align: center;">Bhagavad-gītā As It Is - 11.30</h2>
    <div class="verse-container">
        <p class="trans">O Viṣṇu, I see You devouring all people from all sides with Your flaming mouths. Covering all the universe with Your effulgence, You are manifest with terrible, scorching rays.</p>
