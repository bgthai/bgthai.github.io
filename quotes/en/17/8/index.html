    <h2 style="text-align: center;">Bhagavad-gītā As It Is - 17.8</h2>
    <div class="verse-container">
        <p class="trans">Foods dear to those in the mode of goodness increase the duration of life, purify one’s existence and give strength, health, happiness and satisfaction. Such foods are juicy, fatty, wholesome, and pleasing to the heart.</p>
